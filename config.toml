# =============================================================================
#  DuoQ Challenge : configuration
#  Toutes les règles modifiables du challenge sont ici. Après une modification,
#  vérifiez le fichier avec :  .venv\Scripts\python config.py
# =============================================================================

[challenge]
nom = "DuoQ Challenge 2027"
# Heure de Paris (+01:00 en janvier). Dates provisoires.
debut = 2027-01-22T00:00:00+01:00
fin   = 2027-01-29T23:59:00+01:00
# Nombre maximum de parties par équipe (les remakes ne comptent pas).
parties_max = 50

[riot]
# Hypothèse : tous les joueurs sont sur EUW.
region     = "europe"   # adresses des comptes et des parties
plateforme = "euw1"     # adresses des classements
file_id    = 420        # file « Classée Solo/Duo »

[bonus]
# Bonus de plus longue série de victoires, versé à CHAQUE joueur de l'équipe
# (donc 2 x 50 = 100 pour l'équipe). En cas d'égalité, chaque équipe le reçoit.
serie_par_joueur = 50
# Bonus du joueur le mieux classé : désactivé pour l'instant (0).
mieux_classe = 0

[bonus.paliers]
# Points gagnés en atteignant chaque palier pendant le challenge.
# Le bonus dépend du palier actuel : perdu si l'on redescend, regagné si l'on remonte.
# Les noms doivent être ceux de l'API Riot (en anglais, en majuscules).
BRONZE      = 10
SILVER      = 20
GOLD        = 30
PLATINUM    = 40
EMERALD     = 50
DIAMOND     = 60   # valeur ajoutée par nous (+10 par palier)
MASTER      = 70   # idem
GRANDMASTER = 80   # idem
CHALLENGER  = 90   # idem

# --- Équipes -----------------------------------------------------------------
# Riot ID exact de chaque joueur (Pseudo#TAG). Les noms d'équipe sont libres.

[[equipes]]
nom = "Équipe 1"
joueurs = ["WifeBuffed#WIF", "WillOfortune#5090"]

[[equipes]]
nom = "Équipe 2"
joueurs = ["Tomulus#ÀCAB", "Navybloo#EUW"]

[[equipes]]
nom = "Équipe 3"
joueurs = ["JesuisVEXée#6858", "Heltrik#Htrik"]

# --- Icônes de champions devant le pseudo (décoration uniquement) -----------
# Aucun effet sur les scores. Un champion joué au moins « champions_seuil » fois
# pendant le challenge (remakes exclus) remplace un favori ; au plus
# « champions_max » icônes par joueur. Les places restantes vont aux favoris.
# Noms internes de Riot, sans espace ni apostrophe (ex. MissFortune).

[affichage]
champions_seuil = 3   # à revoir après des tests
champions_max   = 2

[favoris]
"WifeBuffed#WIF"    = ["Gangplank"]
"WillOfortune#5090" = ["Thresh"]
"Tomulus#ÀCAB"      = ["Lillia", "Viego"]
"Navybloo#EUW"      = ["MissFortune", "Nilah"]
"JesuisVEXée#6858"  = ["MissFortune", "Seraphine"]
"Heltrik#Htrik"     = ["Ziggs", "Leona"]

# --- Ajustements manuels -----------------------------------------------------
# Pénalités ou corrections décidées ensemble (partie sans le coéquipier,
# score gelé à corriger...). Retirez le « # » devant les 4 lignes pour activer.
# Le nom d'équipe doit être exactement celui défini plus haut.

# [[ajustements]]
# equipe = "Équipe 1"
# points = -20
# motif = "partie jouée sans le coéquipier le 23/01"

# --- Rangs de départ fixés à la main -------------------------------------------
# À n'utiliser que si le rang de départ calculé automatiquement est faux
# (par exemple si le premier relevé est arrivé après la 2e partie de placement).
# palier : IRON, BRONZE, SILVER, GOLD, PLATINUM, EMERALD, DIAMOND, MASTER,
#          GRANDMASTER, CHALLENGER ; division : I, II, III ou IV (rien au-delà de Diamant).
# Retirez les « # » devant les 5 lignes pour activer.

# [[rangs_depart]]
# joueur = "Tomulus#ÀCAB"
# palier = "GOLD"
# division = "IV"
# lp = 0
